# Standalone workflow for obs-streamelements-core: keeps VirusTotal Monitor storage healthy.
#
# Runs daily so storage stays under control during quiet periods, and on demand so anyone can
# check usage or preview the policy without deleting anything.

name: VirusTotal Monitor prune

on:
  schedule:
    # 04:20 UTC daily, off the hour to avoid GitHub's scheduling stampede.
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log what would be deleted without deleting it'
        type: boolean
        default: true
      high-watermark:
        description: 'Usage percentage at which pruning starts'
        default: '80'
      target-watermark:
        description: 'Usage percentage to prune back down to'
        default: '60'

permissions:
  contents: read

concurrency:
  # Never let two prunes delete against the same storage picture.
  group: virustotal-monitor-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune old versions from VirusTotal Monitor
        uses: StreamElements/virustotal-monitor-action@v1
        with:
          # The action has no default and reads no environment variable — the key is always
          # passed in. Point this at whatever your repo or org calls the secret.
          api-key: ${{ secrets.VT_MONITOR_API_KEY }}
          mode: prune
          managed-prefixes: /obs-streamelements/windows
          quota-bytes: ${{ vars.VT_MONITOR_QUOTA_BYTES || '1GiB' }}
          high-watermark: ${{ inputs.high-watermark || vars.VT_MONITOR_HIGH_WATERMARK || '80' }}
          target-watermark: ${{ inputs.target-watermark || vars.VT_MONITOR_TARGET_WATERMARK || '60' }}
          keep-versions: ${{ vars.VT_MONITOR_KEEP_VERSIONS || '10' }}
          # Anything these point at is never deleted. If any of them cannot be fetched, the
          # step fails rather than pruning with an incomplete picture of what is live.
          #
          # CONFIRM THESE URLS before enabling deletion — the paths below follow the
          # package_url convention in template.manifest but were not reachable when this
          # example was written. Run once with dry-run: true and check the job summary lists
          # the live releases as "kept (manifest)".
          manifest-urls: |
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed/obs-streamelements.qa.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed/obs-streamelements.beta.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed/obs-streamelements.latest.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed/obs-streamelements.stable.manifest
          # Scheduled runs default to enforcing; manual runs default to previewing.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
          # Storage housekeeping must never take a release down with it.
          on-error: warn
